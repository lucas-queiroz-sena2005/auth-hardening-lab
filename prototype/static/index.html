<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impenetrable Security Prototype</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-orange: #fb923c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.75rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1.25rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-blue);
            color: #0f172a;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
            margin-top: 0.5rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .response-box {
            grid-column: 1 / -1;
            margin-top: 1.5rem;
            background-color: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 100px;
            overflow-x: auto;
        }

        .response-box .title {
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--accent-blue);
            font-family: system-ui;
        }

        .status-success { color: var(--accent-green); }
        .status-error { color: var(--accent-red); }
        .status-ratelimit { color: var(--accent-orange); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Impenetrable Security Prototype</h1>
        <p>Atomic Go Backend with Constant-Time Hashing, NFC Normalization & SQLite WAL</p>
        <div class="badge">HTTPS TLS 1.3 Active</div>
    </header>

    <div class="grid">
        <!-- REGISTRATION CARD -->
        <div class="card">
            <h2>Register Identity</h2>
            <form id="regForm">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" required autocomplete="off" placeholder="alice">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password (Min 8 characters)</label>
                    <input type="password" id="regPassword" required placeholder="••••••••••••">
                </div>
                <div class="form-group">
                    <label for="regKey">System Key (Default: admin-key)</label>
                    <input type="password" id="regKey" required value="admin-key" placeholder="admin-key">
                </div>
                <button type="submit">Submit Registration (/reg)</button>
            </form>
        </div>

        <!-- LOGIN CARD -->
        <div class="card">
            <h2>Authenticate Session</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" required autocomplete="off" placeholder="alice">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••••••">
                </div>
                <button type="submit">Login (/log)</button>
            </form>
        </div>
    </div>

    <!-- RESPONSE LOG -->
    <div class="response-box" id="responseBox">
        <div class="title">System Output Log</div>
        <div id="logOutput">Ready. Submit a registration or login request above.</div>
    </div>
</div>

<script>
    const logOutput = document.getElementById('logOutput');

    function showResponse(status, data) {
        let statusClass = 'status-success';
        if (status === 429) statusClass = 'status-ratelimit';
        else if (status >= 400) statusClass = 'status-error';

        const timestamp = new Date().toISOString().split('T')[1].slice(0, 8);
        const formattedJSON = JSON.stringify(data, null, 2);

        logOutput.innerHTML = `[${timestamp}] <span class="${statusClass}">HTTP Status: ${status}</span>\n${formattedJSON}`;
    }

    document.getElementById('regForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            u: document.getElementById('regUsername').value,
            p: document.getElementById('regPassword').value,
            k: document.getElementById('regKey').value
        };

        try {
            const res = await fetch('/reg', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            showResponse(res.status, data);
        } catch (err) {
            showResponse(500, { error: err.message });
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            u: document.getElementById('loginUsername').value,
            p: document.getElementById('loginPassword').value
        };

        try {
            const res = await fetch('/log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            showResponse(res.status, data);
        } catch (err) {
            showResponse(500, { error: err.message });
        }
    });
</script>

</body>
</html>
